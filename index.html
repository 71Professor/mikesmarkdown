<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HedgeDoc Style Markdown Editor</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div class="brand">
          <span class="brand-dot"></span>
          <div>
            <h1>HedgeDoc Workspace</h1>
            <p>Write Markdown on the left, preview on the right.</p>
          </div>
        </div>
        <div class="status">
          <span class="status-pill">Live Preview</span>
          <span class="status-message" id="status-message">Ready</span>
          <button class="ghost" id="run-checks">Run checks</button>
          <button class="primary" id="copy-markdown">Copy Markdown</button>
        </div>
      </header>

      <main class="workspace">
        <section class="editor" aria-label="Markdown editor">
          <div class="panel-header">
            <h2>Markdown</h2>
            <div class="panel-actions">
              <button class="ghost" data-action="bold"><strong>B</strong></button>
              <button class="ghost" data-action="italic"><em>I</em></button>
              <button class="ghost" data-action="code">&lt;/&gt;</button>
              <button class="ghost" data-action="quote">“”</button>
              <button class="ghost" data-action="list">• List</button>
            </div>
          </div>
          <textarea id="markdown-input" spellcheck="true"></textarea>
        </section>

        <section class="preview" aria-label="Markdown preview">
          <div class="panel-header">
            <h2>Preview</h2>
            <div class="panel-actions">
              <button class="ghost" id="clear-preview">Clear</button>
            </div>
          </div>
          <article id="markdown-preview" class="preview-content" tabindex="0"></article>
        </section>
      </main>

      <footer class="app-footer">
        <div>
          Tips: Use <kbd>⌘/Ctrl + S</kbd> to download, <kbd>⌘/Ctrl + Enter</kbd> to toggle focus.
        </div>
        <div class="footer-actions">
          <input type="file" id="import-md" accept=".md,.markdown,text/markdown" hidden />
          <button class="ghost" id="import-button">Import .md</button>
          <button class="ghost" id="export-html">Export HTML</button>
          <button class="secondary" id="download-md">Download .md</button>
        </div>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
